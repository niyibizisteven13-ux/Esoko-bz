<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/bwenge-logo.svg" />
    <meta name="theme-color" content="#1B2A4A" />
    <meta name="description" content="Bwenge — digital commerce, payments, inventory, and business tools for Rwanda." />
    <title>Bwenge</title>
    <script>
      // Remove caches created by older service workers that could return stale
      // hashed chunks after a deployment. This runs once per browser session.
      (() => {
        const resetKey = 'bwenge-service-worker-reset-v1';
        if (sessionStorage.getItem(resetKey)) return;
        sessionStorage.setItem(resetKey, '1');
        if (!('serviceWorker' in navigator)) return;
        Promise.all([
          navigator.serviceWorker.getRegistrations().then((registrations) =>
            Promise.all(registrations.map((registration) => registration.unregister()))
          ),
          'caches' in window
            ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
            : Promise.resolve(),
        ]).then(() => window.location.reload()).catch(() => undefined);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
