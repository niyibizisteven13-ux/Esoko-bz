services:
  - type: web
    name: esoko
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: esoko-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAMESITE
        value: strict
      - key: APP_URL
        value: https://esoko-bz-1.onrender.com
      - key: FRONTEND_URLS
        value: https://esoko-bz-1.onrender.com
      - key: DATA_DIR
        value: /app/data
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_FAMILY
        value: "4"
      - key: SMTP_REQUIRE_TLS
        value: "true"
      - key: SMTP_CONNECTION_TIMEOUT_MS
        value: "60000"
      - key: SMTP_GREETING_TIMEOUT_MS
        value: "60000"
      - key: SMTP_SOCKET_TIMEOUT_MS
        value: "120000"
      - key: SMTP_REQUIRE_AUTH
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
